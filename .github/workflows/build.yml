name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires et APK de debug
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: podkids-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
